[project]
name = "simple-agent-template"
version = "0.1.0"
description = "Minimal LangChain agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "motor>=3.7.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-chroma>=0.2.0",
    "langchain-groq>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.0.0",
    "langsmith>=0.3.0",
    "chromadb>=1.0.0",
    "sentence-transformers>=5.0.0",
    "pymongo>=4.12.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
    "uv>=0.11.12",
]

[tool.uv.build-backend]
module-name = "simple_agent"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]
